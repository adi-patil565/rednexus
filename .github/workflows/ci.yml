# CI — lint, test, build.
#
# NOTE ON LOCATION: this file has to live at .github/workflows/ in the
# repository root. Architecture.md places it under infra/.github/, which
# reads tidily but GitHub never scans there, so a workflow put in that
# directory silently never runs — the worst possible failure mode for
# something whose whole job is to catch failures. infra/.github/ now
# holds a pointer to here.
#
# The backend tests are integration tests against a real Postgres, not
# unit tests against a mock. They need a database with the seed fixtures
# in it, so this workflow stands one up rather than skipping them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # PostGIS rather than plain postgres, matching docker-compose. The
      # current migrations do not need the extension, but Phase 5's
      # distance ranking will, and discovering that in CI later is worse
      # than pulling a slightly larger image now.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rednexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rednexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/rednexus
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # No GOOGLE_APPLICATION_CREDENTIALS on purpose. The tests mock
      # Firebase token verification, and the server is built to boot
      # without a service account — authenticated routes return 503
      # rather than crashing. If that ever regresses, this job fails,
      # which is exactly the coverage wanted.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Seed fixtures
        # The tests assert against these by id — a verified institution,
        # an unverified one, a platform admin, donors covering every
        # eligibility branch. Without them the suite fails loudly with
        # "Fixtures missing" rather than silently passing on empty data.
        run: npm run db:seed

      - name: Test
        run: npm test

  web:
    name: Web build
    runs-on: ubuntu-latest

    env:
      # Build-time placeholders. packages/api/src/firebase.js throws when
      # config is missing — deliberately, so a missing .env fails loudly
      # rather than silently pointing at production. These values are
      # never used to reach Firebase; nothing in a static build calls it.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  ml:
    name: ML fallback tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        # Prophet is deliberately omitted. It pulls cmdstan and takes
        # minutes to build, and its ABSENCE is itself a tested path —
        # test_prophet_falls_back_when_unavailable covers exactly this
        # case. Running CI without it proves the optional dependency is
        # genuinely optional, which is more valuable than running the
        # model here.
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels scikit-learn

      - name: Test fallbacks
        working-directory: ml-service
        run: python test_fallback.py
